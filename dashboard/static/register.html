<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | SEO Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Create Account</h2>
        <div id="error-msg" class="hidden bg-red-100 text-red-700 p-2 rounded mb-4 text-sm"></div>
        <div id="success-msg" class="hidden bg-green-100 text-green-700 p-2 rounded mb-4 text-sm">Account created! Redirecting to login...</div>
        
        <form id="register-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div class="flex items-center justify-between">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">Register</button>
            </div>
            <div class="mt-4 text-center">
                <a href="/login.html" class="text-sm text-blue-600 hover:text-blue-800">Already have an account? Login</a>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            
            if (res.ok) {
                document.getElementById('success-msg').classList.remove('hidden');
                document.getElementById('error-msg').classList.add('hidden');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            } else {
                const data = await res.json();
                const errDiv = document.getElementById('error-msg');
                errDiv.textContent = data.detail || 'Registration failed';
                errDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
